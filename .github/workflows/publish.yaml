name: Publish on GitHub and CurseForge

on:
  push:
    tags:
      - 'v*'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_number: "${{ steps.version_number.outputs.result }}"
      version_type: "${{ steps.version_type.outputs.result }}"
    steps:
      - name: Get Version
        id: version_number
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            let ref = '${{ github.ref }}';
            return ref.startsWith('refs/tags/v') ? ref.replace('refs/tags/v', '') : 'indev';

      - name: Get Version Type
        id: version_type
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            let version = '${{ steps.version_number.outputs.result }}';
            return version.includes('alpha') ? 'alpha' : (version.includes('beta') ? 'beta' : 'release');

  main:
    needs: [ version ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ needs.version.outputs.version_number }}
      VERSION_TYPE: ${{ needs.version.outputs.version_type }}
      EXTENDED_SLOT_CAPACITY_DIR: .deps/ExtendedSlotCapacity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Extended Slot Capacity
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ExtendedSlotCapacity
          ref: ${{ vars.EXTENDED_SLOT_CAPACITY_REF || 'port/neoforge-1.21.1' }}
          path: .deps/ExtendedSlotCapacity

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Log Version Info
        run: echo "version = $VERSION, type = $VERSION_TYPE"

      - name: Build
        run: ./gradlew build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID" || { echo "Missing repository variable CURSEFORGE_PROJECT_ID"; exit 1; }
          test -n "$CURSEFORGE_API_KEY" || { echo "Missing repository secret CURSEFORGE_API_KEY"; exit 1; }

      - name: Publish (CurseForge/GitHub)
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}

          github-tag: ${{ github.ref_name }}
          github-draft: false
          github-prerelease: ${{ env.VERSION_TYPE != 'release' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          name: "Sacks 'N Such-1.21.1-${{ env.VERSION }}"
          version: "${{ env.VERSION }}"
          version-type: "${{ env.VERSION_TYPE }}"

          files: |
            build/libs/*.jar

          loaders: neoforge

          game-versions: "1.21.1"
          java: 21
          changelog-file: CHANGELOG.md
